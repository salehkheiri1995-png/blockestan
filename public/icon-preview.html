<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 36px; background: #04211e; font-family: system-ui, sans-serif; color: #bfe9e2; }
      .row { display: flex; gap: 40px; align-items: flex-end; }
      .item { text-align: center; font-size: 13px; opacity: 0.9; }
      .art { display: block; width: 300px; height: 300px; object-fit: cover; }
      .circle { border-radius: 50%; }
      .sm { width: 96px; height: 96px; }
      .xs { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="item">
        <img class="art circle" src="/icon-mascot.svg" />
        <div>A — ملایم‌تر</div>
        <img class="art sm circle" src="/icon-mascot.svg" />
        <img class="art xs circle" src="/icon-mascot.svg" />
      </div>
      <div class="item">
        <img class="art circle" src="/icon-mascot-b.svg" />
        <div>B — روشن‌تر و پررنگ‌تر</div>
        <img class="art sm circle" src="/icon-mascot-b.svg" />
        <img class="art xs circle" src="/icon-mascot-b.svg" />
      </div>
    </div>
  </body>
</html>
