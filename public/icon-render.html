<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: #04211e; }
      img { display: block; }
    </style>
  </head>
  <body>
    <img id="icon" src="/icon-mascot-b.svg" alt="icon" />
    <script>
      const size = 1024 / (window.devicePixelRatio || 1);
      const img = document.getElementById('icon');
      img.style.width = size + 'px';
      img.style.height = size + 'px';
      document.body.style.width = size + 'px';
      document.body.style.height = size + 'px';
    </script>
  </body>
</html>
